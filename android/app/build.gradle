apply plugin: 'com.android.application'

android {
    namespace = "app.reverseflow.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.reverseflow.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 142
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        preview {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

def removeDuplicateGeneratedConfigFiles = tasks.register("removeDuplicateGeneratedConfigFiles") {
    doLast {
        delete fileTree(project.file("src/main/res/xml")) {
            include "config *.xml"
            include ".DS_Store"
        }
        delete fileTree(project.file("build/intermediates/packaged_res")) {
            include "**/config *.xml"
            include "**/.DS_Store"
        }
    }
}

tasks.matching { task -> task.name == "preBuild" }.configureEach {
    dependsOn(removeDuplicateGeneratedConfigFiles)
}

def registerSupporterBackendAssets = { String buildType, String environment ->
    def capitalizedBuildType = buildType.capitalize()
    def sourceConstants = rootProject.file("../www/js/constants.js")
    def outputDirectory = layout.buildDirectory.dir("generated/supporterBackend/${buildType}")
    def outputConstants = outputDirectory.map {
        it.file("public/js/constants.js")
    }
    def generateTask = tasks.register(
        "generate${capitalizedBuildType}SupporterBackendAssets"
    ) {
        inputs.file(sourceConstants)
        inputs.property("supporterApiEnvironment", environment)
        outputs.file(outputConstants)
        doLast {
            def source = sourceConstants.getText("UTF-8")
            def configured = source.replaceFirst(
                /const SUPPORTER_API_ENVIRONMENT = "(preview|production)";/,
                "const SUPPORTER_API_ENVIRONMENT = \"${environment}\";"
            )
            if (!configured.contains("const SUPPORTER_API_ENVIRONMENT = \"${environment}\";")) {
                throw new GradleException("Supporter backend environment was not configured.")
            }
            def target = outputConstants.get().asFile
            target.parentFile.mkdirs()
            target.setText(configured, "UTF-8")
        }
    }
    android.sourceSets[buildType].assets.srcDir(outputDirectory)
    tasks.matching { task ->
        task.name != generateTask.name
            && task.name.contains(capitalizedBuildType)
            && (
                task.name.toLowerCase().contains("assets")
                || task.name.toLowerCase().contains("lint")
            )
    }.configureEach {
        dependsOn(generateTask)
    }
}

registerSupporterBackendAssets("debug", "preview")
registerSupporterBackendAssets("preview", "preview")
registerSupporterBackendAssets("release", "production")

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
