<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reverse Flow" />
  <meta name="application-name" content="Reverse Flow: Fire Hydraulics" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="manifest" href="manifest.json?v=6" />
  <script src="js/appearance.js?v=build-1"></script>
  <style>
    html {
      min-height: 100%;
      background: #e7edf3;
      color: #111827;
    }
    html[data-resolved-theme="dark"] {
      background: #020617;
      color: #f8fafc;
    }
    body {
      min-height: 100vh;
      background: inherit;
      color: inherit;
    }
  </style>

  <title>References | Reverse Flow</title>

  <link rel="stylesheet" href="css/base.css?v=appearance-1" />
  <link rel="stylesheet" href="css/components.css?v=appearance-2" />
  <link rel="stylesheet" href="css/calculators.css?v=flash-3" />
  <link rel="stylesheet" href="css/support.css?v=appearance-1" />
  <link rel="stylesheet" href="css/responsive.css?v=appearance-1" />
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1 class="app-header-title">Reverse Flow</h1>
        <p class="app-header-subtitle">
          Fire Hydraulics
        </p>
      </div>
    </div>
  </header>

  <main id="referencesPage">
    <nav class="page-nav" aria-label="Primary">
      <a class="reset-button nav-action-button nav-button-link" href="index.html">Calculator</a>
      <a class="reset-button nav-action-button nav-button-link active" href="tools.html">Tools</a>
      <a class="reset-button nav-action-button nav-button-link" href="settings.html">Settings</a>
    </nav>

    <section class="card app-view-panel">
      <div class="form-grid">
        <div class="field full">
          <label>References</label>
          <p class="helper">
            Manufacturer information, reviewed training resources, and instructor listings for fire hydraulics.
          </p>
        </div>

        <div id="referencesList" class="references-list" aria-live="polite"></div>
      </div>
    </section>

    <p class="version-footer">
      Reverse Flow: Fire Hydraulics © 2026
    </p>
  </main>

  <script src="js/constants.js?v=build-6"></script>
  <script src="js/services/entitlement.js?v=build-2"></script>
  <script>
    window.__reverseFlowReferencesLocked =
      typeof guardToolsAccess === "function" &&
      !guardToolsAccess({
        safeUrl: "index.html",
        redirectDelayMs: 250,
        reason: "references-page-load"
      });
  </script>
  <script src="js/data/references.js?v=hen-products-3"></script>
  <script>
    if (!window.__reverseFlowReferencesLocked) {
    const referencesList = document.getElementById("referencesList");
    const trainingDirectoryFilterState = {
      topic: "",
      location: ""
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getReferenceData() {
      return typeof referencesData === "object" && referencesData
        ? {
            manufacturers: referencesData.manufacturers || { hose: [], equipment: [] },
            trainingPartners: referencesData.trainingPartners || [],
            trainingResources: referencesData.trainingResources || []
          }
        : { manufacturers: { hose: [], equipment: [] }, trainingPartners: [], trainingResources: [] };
    }

    function getRoute() {
      const params = new URLSearchParams(window.location.search);
      return {
        section: params.get("section"),
        id: params.get("id")
      };
    }

    function getReferenceUrl(section, id) {
      const params = new URLSearchParams({ section, id });
      return `references.html?${params.toString()}`;
    }

    function getFrictionLossChartUrl() {
      return "tools.html?calculator=friction-loss-chart";
    }

    function createReferenceLinkCard(title, helper, href, actionText = "Open") {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-nav-card";
      card.innerHTML = `
        <div>
          <strong>${escapeHtml(title)}</strong>
          <p class="helper">${escapeHtml(helper)}</p>
        </div>
        <a class="reset-button reference-open-button" href="${escapeHtml(href)}">
          ${escapeHtml(actionText)}
        </a>
      `;
      return card;
    }

    function createTrainingResourcesEmptyCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>Training Resources Coming Soon</strong>
          <p class="helper">
            This section will include fire hydraulics training material, reference guides, and operational resources as they are developed and reviewed.
          </p>
        </div>
      `;
      return card;
    }

    function createTrainingDirectoryEmptyCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>Training Directory listings are coming soon.</strong>
          <p class="helper">This section will help users discover reviewed fire service training resources and instructor listings.</p>
        </div>
      `;
      return card;
    }

    function createTrainingDirectoryNoResultsCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>No training providers match those filters.</strong>
          <p class="helper">Clear the filters to return to all Training Directory listings.</p>
        </div>
        <button class="reset-button reference-open-button" type="button" data-training-filter-reset>
          Reset
        </button>
      `;
      return card;
    }

    function createManufacturerEmptyStateHtml() {
      return `
        <article class="hose-library-card reference-card reference-empty-card">
          <div>
            <strong>Manufacturer References Coming Soon</strong>
            <p class="helper">
              Manufacturer reference materials will be added here as published source data is reviewed.
            </p>
          </div>
        </article>
      `;
    }

    function getHoseManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.hose)
        ? data.manufacturers.hose
        : [];
    }

    function getEquipmentManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.equipment)
        ? data.manufacturers.equipment
        : [];
    }

    function getManufacturerCount(data) {
      return getHoseManufacturers(data).length + getEquipmentManufacturers(data).length;
    }

    function getTrainingDirectoryListings(data) {
      return Array.isArray(data.trainingPartners)
        ? data.trainingPartners.filter(item => item.status !== "placeholder")
        : [];
    }

    function getUniqueTrainingFilterOptions(listings, field) {
      return [...new Set(
        listings.flatMap(listing => Array.isArray(listing[field]) ? listing[field] : [])
          .map(value => String(value).trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));
    }

    function createFilterOptionList(options, selectedValue, allLabel) {
      return `
        <option value="">${escapeHtml(allLabel)}</option>
        ${options.map(option => `
          <option value="${escapeHtml(option)}"${option === selectedValue ? " selected" : ""}>
            ${escapeHtml(option)}
          </option>
        `).join("")}
      `;
    }

    function filterTrainingDirectoryListings(listings) {
      const selectedTopic = trainingDirectoryFilterState.topic;
      const selectedLocation = trainingDirectoryFilterState.location;

      return listings.filter(listing => {
        const topics = Array.isArray(listing.topics) ? listing.topics : [];
        const locations = Array.isArray(listing.locations) ? listing.locations : [];
        const matchesTopic = !selectedTopic || topics.includes(selectedTopic);
        const matchesLocation = !selectedLocation || locations.includes(selectedLocation);
        return matchesTopic && matchesLocation;
      });
    }

    function createTrainingDirectoryFilterCard(listings) {
      const topicOptions = getUniqueTrainingFilterOptions(listings, "topics");
      const locationOptions = getUniqueTrainingFilterOptions(listings, "locations");
      const hasActiveFilters = !!trainingDirectoryFilterState.topic || !!trainingDirectoryFilterState.location;
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-filter-card";
      card.innerHTML = `
        <div class="reference-filter-fields">
          <label>
            <span>Topic</span>
            <select data-training-filter="topic">
              ${createFilterOptionList(topicOptions, trainingDirectoryFilterState.topic, "All Topics")}
            </select>
          </label>
          <label>
            <span>Location</span>
            <select data-training-filter="location">
              ${createFilterOptionList(locationOptions, trainingDirectoryFilterState.location, "All Locations")}
            </select>
          </label>
        </div>
        <button
          class="reset-button reference-open-button${hasActiveFilters ? "" : " disabled"}"
          type="button"
          data-training-filter-reset
          ${hasActiveFilters ? "" : "disabled"}
        >
          Clear
        </button>
      `;
      return card;
    }

    function createTrainingDirectoryListingCard(partner) {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-nav-card reference-directory-card";
      const visibleTopics = Array.isArray(partner.topics) ? partner.topics.slice(0, 3) : [];
      const hiddenTopicCount = Array.isArray(partner.topics)
        ? Math.max(0, partner.topics.length - visibleTopics.length)
        : 0;
      card.innerHTML = `
        <div>
          <strong>${escapeHtml(partner.name)}</strong>
          <p class="helper">${escapeHtml(partner.subtitle || partner.serviceArea || "Training provider listing.")}</p>
          ${visibleTopics.length
            ? `
              <div class="reference-topic-tags" aria-label="Training topics">
                ${visibleTopics.map(topic => `<span>${escapeHtml(topic)}</span>`).join("")}
                ${hiddenTopicCount ? `<span>+${hiddenTopicCount}</span>` : ""}
              </div>
            `
            : ""}
        </div>
        <a class="reset-button reference-open-button" href="${escapeHtml(getReferenceUrl("training-partner", partner.id))}">
          View Listing
        </a>
      `;
      return card;
    }

    function createCollapsedSection(title, helper, bodyHtml) {
      const section = document.createElement("details");
      section.className = "settings-tool-card collapsible-settings-card reference-section-card";
      section.innerHTML = `
        <summary>
          <span>
            <strong>${escapeHtml(title)}</strong>
            <span class="helper">${escapeHtml(helper)}</span>
          </span>
        </summary>
        <div class="collapsible-card-body">
          ${bodyHtml}
        </div>
      `;
      return section;
    }

    function createReferenceLinkList(items, section) {
      return items.map(item => `
        <article class="hose-library-card reference-card reference-nav-card">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <p class="helper">${escapeHtml(item.helper)}</p>
          </div>
          <a class="reset-button reference-open-button" href="${escapeHtml(getReferenceUrl(section, item.id))}">
            ${escapeHtml(item.actionText || "Open")}
          </a>
        </article>
      `).join("");
    }

    function createManufacturerWebsiteCard(manufacturer) {
      if (!manufacturer.websiteUrl) {
        return "";
      }

      return `
        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Official Website</strong>
            <p class="helper">${escapeHtml(manufacturer.websiteUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.websiteUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Website
          </a>
        </article>
      `;
    }

    function createTrainingPartnerLogo(partner) {
      if (!partner.logo) {
        return "";
      }

      return `
        <img
          class="reference-partner-logo"
          src="${escapeHtml(partner.logo)}"
          alt="${escapeHtml(partner.name)} logo"
          loading="lazy"
        />
      `;
    }

    function createTrainingPartnerContactCard(partner) {
      const hasEmail = !!partner.contactEmail;
      const hasWebsite = !!partner.websiteUrl;
      const hasPhone = !!partner.phone;
      const hasContactName = !!partner.contactName;
      const hasSocialLinks = Array.isArray(partner.socialLinks) && partner.socialLinks.length > 0;
      const isPlaceholder = partner.status === "placeholder";

      const contactRows = [
        hasContactName
          ? `
            <span>
              <strong>Primary Contact</strong>
              ${escapeHtml(partner.contactTitle ? `${partner.contactName} - ${partner.contactTitle}` : partner.contactName)}
            </span>
          `
          : "",
        partner.established
          ? `
            <span>
              <strong>Established</strong>
              ${escapeHtml(partner.established)}
            </span>
          `
          : "",
        hasPhone
          ? `
            <span>
              <strong>Phone</strong>
              <a href="tel:${escapeHtml(partner.phoneHref || partner.phone)}">${escapeHtml(partner.phone)}</a>
            </span>
          `
          : "",
        hasEmail
          ? `
            <span>
              <strong>Email</strong>
              <a href="mailto:${escapeHtml(partner.contactEmail)}">${escapeHtml(partner.contactEmail)}</a>
            </span>
          `
          : ""
      ].filter(Boolean).join("");

      return `
        <article class="hose-library-card reference-card reference-website-card reference-partner-contact-card">
          <div>
            <strong>Contact</strong>
            <p class="helper">
              ${isPlaceholder && hasEmail
                ? `Training organizations and instructors can email ${escapeHtml(partner.contactEmail)} for listing review.`
                : hasEmail || hasPhone || hasContactName
                  ? "Contact information submitted for this Training Directory listing."
                  : "Contact information has not been added yet."}
            </p>
            ${contactRows ? `<div class="reference-contact-details">${contactRows}</div>` : ""}
          </div>
          <div class="reference-partner-actions">
            ${hasEmail
              ? `
                <a
                  class="reset-button reference-open-button"
                  href="mailto:${escapeHtml(partner.contactEmail)}"
                >
                  ${isPlaceholder ? "Contact Reverse Flow" : "Email"}
                </a>
              `
              : ""}
            ${hasPhone
              ? `
                <a
                  class="reset-button reference-open-button"
                  href="tel:${escapeHtml(partner.phoneHref || partner.phone)}"
                >
                  Call
                </a>
              `
              : ""}
            ${hasWebsite
              ? `
                <a
                  class="reset-button reference-open-button"
                  href="${escapeHtml(partner.websiteUrl)}"
                  target="_blank"
                  rel="noopener"
                >
                  Visit Website
                </a>
              `
              : ""}
            ${hasSocialLinks
              ? partner.socialLinks.map(link => `
                <a
                  class="reset-button reference-open-button"
                  href="${escapeHtml(link.url)}"
                  target="_blank"
                  rel="noopener"
                >
                  ${escapeHtml(link.label)}
                </a>
              `).join("")
              : ""}
          </div>
        </article>
      `;
    }

    function createTrainingPartnerSpecialties(partner) {
      if (!Array.isArray(partner.specialties) || partner.specialties.length === 0) {
        return `<p class="helper">Specialties coming soon.</p>`;
      }

      return `
        <div class="reference-specialty-tags" aria-label="Training directory specialties">
          ${partner.specialties.map(specialty => `
            <span>${escapeHtml(specialty)}</span>
          `).join("")}
        </div>
      `;
    }

    function createCategoryList(categories) {
      if (!Array.isArray(categories) || categories.length === 0) {
        return `<p class="helper">No categories added yet.</p>`;
      }

      return `
        <div class="reference-category-list">
          ${categories.map(category => `
            <details class="hose-library-card reference-category-card collapsible-settings-card">
              <summary>
                <span>
                  <strong>${escapeHtml(category)}</strong>
                  <span class="helper">Product references coming soon.</span>
                </span>
              </summary>
              <div class="collapsible-card-body">
                <p class="helper">Manufacturer resources and product reference content will live here.</p>
              </div>
            </details>
          `).join("")}
        </div>
      `;
    }

    function renderOverview(data) {
      referencesList.innerHTML = "";
      const manufacturerCount = getManufacturerCount(data);
      const trainingDirectoryListings = getTrainingDirectoryListings(data);
      const manufacturerBody = `
        <article class="hose-library-card reference-card reference-nav-card">
          <div>
            <strong>Manufacturers</strong>
            <p class="helper">Hose and equipment manufacturer references for supported Reverse Flow products.</p>
          </div>
          <a class="reset-button reference-open-button" href="references.html?section=manufacturers">
            Open
          </a>
        </article>
      `;

      const trainingPartnersBody = trainingDirectoryListings.length
        ? createReferenceLinkList(
            trainingDirectoryListings.map(partner => ({
              id: partner.id,
              name: partner.name,
              helper: partner.subtitle || "Coming soon",
              actionText: "View Listing"
            })),
            "training-partner"
          )
        : `
            <article class="hose-library-card reference-card reference-empty-card">
              <div>
                <strong>Training Directory listings are coming soon.</strong>
                <p class="helper">This section will help users discover reviewed fire service training resources and instructor listings.</p>
              </div>
              <a class="reset-button reference-open-button" href="references.html?section=training-partners">
                Open
              </a>
            </article>
          `;

      referencesList.appendChild(
        createCollapsedSection(
          "Manufacturers",
          manufacturerCount
            ? `${manufacturerCount} manufacturer resource ${manufacturerCount === 1 ? "page" : "pages"}`
            : "Manufacturer reference materials coming soon",
          manufacturerBody
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Training Directory",
          "Curated fire service training resources reviewed by Reverse Flow.",
          trainingPartnersBody
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Training Resources",
          "Fire hydraulics training material coming soon",
          `
            <article class="hose-library-card reference-card reference-nav-card">
              <div>
                <strong>Training Resources Coming Soon</strong>
                <p class="helper">This section will include fire hydraulics training material, reference guides, and operational resources as they are developed and reviewed.</p>
              </div>
              <a class="reset-button reference-open-button" href="references.html?section=training-resources">
                Open
              </a>
            </article>
          `
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Friction Loss Chart",
          "Generate a reference chart from your current default hose coefficients.",
          `
            <article class="hose-library-card reference-card reference-nav-card">
              <div>
                <strong>Friction Loss Chart</strong>
                <p class="helper">Generate a friction loss reference chart from your current default hose coefficients.</p>
              </div>
              <a class="reset-button reference-open-button" href="${escapeHtml(getFrictionLossChartUrl())}">
                Open
              </a>
            </article>
          `
        )
      );
    }

    function renderManufacturers(data) {
      const hoseManufacturers = getHoseManufacturers(data);
      const equipmentManufacturers = getEquipmentManufacturers(data);
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html">
            Back to References
          </a>
          <h2>Manufacturers</h2>
          <p class="helper">Browse manufacturer reference pages by category.</p>
        </div>
      `;

      referencesList.appendChild(
        createReferenceLinkCard(
          "Hose Manufacturers",
          hoseManufacturers.length
            ? `${hoseManufacturers.length} hose manufacturer reference page`
            : "Hose manufacturer references coming soon",
          "references.html?section=hose-manufacturers",
          "Open"
        )
      );

      referencesList.appendChild(
        createReferenceLinkCard(
          "Equipment Manufacturers",
          equipmentManufacturers.length
            ? `${equipmentManufacturers.length} equipment manufacturer reference page`
            : "Equipment manufacturer references coming soon",
          "references.html?section=equipment-manufacturers",
          "Open"
        )
      );

      const referenceInfo = document.createElement("article");
      referenceInfo.className = "hose-library-card reference-card reference-info-card";
      referenceInfo.innerHTML = `
        <div>
          <strong>Reference Information</strong>
          <p class="helper">
            Manufacturer reference information is compiled from publicly available sources, including manufacturer websites, product literature, and published reference materials. Reference content is continuously reviewed and updated as additional information becomes available.
          </p>
        </div>
      `;
      referencesList.appendChild(referenceInfo);
    }

    function renderHoseManufacturers(data) {
      const hoseManufacturers = getHoseManufacturers(data);
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=manufacturers">
            Back to Manufacturers
          </a>
          <h2>Hose Manufacturers</h2>
          <p class="helper">Published hose data and source links by manufacturer.</p>
        </div>
      `;

      if (!hoseManufacturers.length) {
        referencesList.insertAdjacentHTML("beforeend", createManufacturerEmptyStateHtml());
        return;
      }

      hoseManufacturers.forEach(manufacturer => {
        referencesList.appendChild(
          createReferenceLinkCard(
            manufacturer.name,
            `${manufacturer.hoseData.length} published hose data rows`,
            getReferenceUrl("hose-manufacturer", manufacturer.id),
            "View Data"
          )
        );
      });
    }

    function createEquipmentSpecificationTable(category) {
      const columns = Array.isArray(category.columns) ? category.columns : [];
      const rows = Array.isArray(category.rows) ? category.rows : [];

      if (!columns.length || !rows.length) {
        return `<p class="helper">Product specifications coming soon.</p>`;
      }

      return `
        <div class="reference-equipment-table-wrap">
          <table class="reference-equipment-table">
            <thead>
              <tr>
                ${columns.map(column => `<th>${escapeHtml(column)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  ${columns.map((column, index) => `
                    <td data-label="${escapeHtml(column)}">${escapeHtml(formatReferenceValue(row[index]))}</td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function createEquipmentNotes(notes) {
      if (!Array.isArray(notes) || notes.length === 0) {
        return "";
      }

      return `
        <div class="reference-equipment-notes">
          <strong>Reverse Flow Notes</strong>
          <ul>
            ${notes.map(note => `<li>${escapeHtml(note)}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function getEquipmentProducts(manufacturer) {
      return Array.isArray(manufacturer.products) ? manufacturer.products : [];
    }

    function getEquipmentCategoryProducts(manufacturer, category) {
      const products = getEquipmentProducts(manufacturer);
      const productIds = Array.isArray(category.productIds) ? category.productIds : [];

      if (productIds.length) {
        return productIds
          .map(productId => products.find(product => product.id === productId))
          .filter(Boolean);
      }

      return products.filter(product => product.categoryId === category.id);
    }

    function findEquipmentCategory(data, categoryId) {
      for (const manufacturer of getEquipmentManufacturers(data)) {
        const category = (manufacturer.categories || []).find(item => item.id === categoryId);
        if (category) {
          return { manufacturer, category };
        }
      }

      return null;
    }

    function findEquipmentProduct(data, productId) {
      for (const manufacturer of getEquipmentManufacturers(data)) {
        const product = getEquipmentProducts(manufacturer).find(item => item.id === productId);
        if (product) {
          const category = (manufacturer.categories || []).find(item => item.id === product.categoryId);
          return { manufacturer, category, product };
        }
      }

      return null;
    }

    function createEquipmentProductSpecList(specs) {
      if (!Array.isArray(specs) || specs.length === 0) {
        return `<p class="helper">See the manufacturer datasheet for current product specifications.</p>`;
      }

      return `
        <dl class="reference-product-spec-list">
          ${specs.map(spec => `
            <div>
              <dt>${escapeHtml(spec.label)}</dt>
              <dd>${escapeHtml(spec.value)}</dd>
            </div>
          `).join("")}
        </dl>
      `;
    }

    function createEquipmentProductNotes(notes) {

    function createReferenceFileName(title, extension) {
      const normalizedTitle = String(title || "Datasheet")
        .replace(/[^A-Za-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 80) || "Datasheet";

      return `Reverse_Flow_HEN_${normalizedTitle}_Datasheet.${extension}`;
    }

    function blobToReferenceBase64Payload(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || "");
          const base64 = dataUrl.includes(",")
            ? dataUrl.slice(dataUrl.indexOf(",") + 1)
            : "";

          if (!base64) {
            reject(new Error("PDF base64 payload was empty."));
            return;
          }

          resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error("PDF base64 conversion failed."));
        reader.readAsDataURL(blob);
      });
    }

    async function openReferencePdfNative(url, title) {
      const documentUrl = resolveReferenceAssetUrl(url);
      const plugins = window.Capacitor?.Plugins || {};
      const Filesystem = plugins.Filesystem;
      const Share = plugins.Share;

      if (!Filesystem || !Share) {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      let pdfBlob = null;
      try {
        const response = await fetch(documentUrl);
        if (!response.ok) {
          throw new Error(`PDF request failed with ${response.status}`);
        }
        pdfBlob = await response.blob();
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      let base64Data = "";
      try {
        base64Data = await blobToReferenceBase64Payload(
          pdfBlob.type === "application/pdf"
            ? pdfBlob
            : new Blob([pdfBlob], { type: "application/pdf" })
        );
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      const fileName = createReferenceFileName(title, "pdf");
      const path = `reference-datasheets/${fileName}`;
      let fileUri = "";

      try {
        const writeResult = await Filesystem.writeFile({
          path,
          data: base64Data,
          directory: "CACHE",
          recursive: true
        });
        fileUri = writeResult.uri || "";
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      try {
        await Share.share({
          title: title ? `${title} Datasheet` : "HEN Datasheet",
          files: [fileUri],
          dialogTitle: "Open Datasheet"
        });
      } catch {
        alert("Unable to open this datasheet on this device.");
      }
    }

      const documentUrl = resolveReferenceAssetUrl(url);

      if (isNativeCapacitorReferenceApp()) {

    function getProfileHoseIdFromTradeSize(tradeSize) {
      const normalized = String(tradeSize || "")
        .replaceAll('"', "")
        .trim();
      const tradeSizeMap = {
        "1": "1",
        "1.5": "1.5",
        "1.75": "1.75",
        "1.88": "1.88",
        "2": "2",
        "2.25": "2.25",
        "2.5": "2.5",
        "3": "3",
        "4": "4",
        "5": "5"
      };

      return tradeSizeMap[normalized] || "";
    }

    function numberOrNull(value) {

    function loadMyHoseProfiles() {
      try {
        const saved = localStorage.getItem(CUSTOM_HOSE_PROFILES_KEY);
        const profiles = saved ? JSON.parse(saved) : [];
        return Array.isArray(profiles) ? profiles : [];
      } catch {
        return [];
      }
    }

    function saveMyHoseProfiles(profiles) {

    function addHoseReferenceToProfiles(button) {
      const manufacturerName = button.dataset.manufacturerName || "";
      const model = button.dataset.model || "";
      const tradeSize = button.dataset.tradeSize || "";
      const coefficient = numberOrNull(button.dataset.coefficient);

      if (!model || coefficient === null || coefficient <= 0) {
        alert("This hose reference row does not have enough published data to create a profile.");
        return;
      }

      const profileName = `${manufacturerName} ${model} ${tradeSize}`.replace(/\s+/g, " ").trim();
      const profiles = loadMyHoseProfiles();
      const duplicateProfile = profiles.find(profile =>
        profile.sourceType === "manufacturer-reference" &&
        profile.manufacturer === manufacturerName &&
        profile.model === model &&
        profile.tradeSize === tradeSize &&
        Number(profile.coefficient) === coefficient
      );

      if (duplicateProfile) {
        const confirmed = confirm(`${profileName} already exists in My Hose Profiles. Add another copy?`);
        if (!confirmed) return;
      }

      profiles.push({
        id: `profile-from-reference-${Date.now()}`,
        profileName,
        manufacturer: manufacturerName,
        model,
        sourceModel: model,
        tradeSize,
        appHoseId: getProfileHoseIdFromTradeSize(tradeSize),
        chargedId50: numberOrNull(button.dataset.chargedId50),
        chargedId150: numberOrNull(button.dataset.chargedId150),
        coefficient,
        referenceUrl: button.dataset.referenceUrl || "",
        notes: "Created from manufacturer reference data.",
        custom: true,
        customUse: "both",
        sourceType: "manufacturer-reference"
      });

      saveMyHoseProfiles(profiles);
      alert(`${profileName} was added to My Hose Profiles.`);
    }
