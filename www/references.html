<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reverse Flow" />
  <meta name="application-name" content="Reverse Flow: Fire Hydraulics" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="manifest" href="manifest.json?v=6" />
  <style>
    html {
      min-height: 100%;
      background: #e7edf3;
      color: #111827;
    }
    @media (prefers-color-scheme: dark) {
      html {
        background: #020617;
        color: #f8fafc;
      }
    }
    body {
      min-height: 100vh;
      background: inherit;
      color: inherit;
    }
  </style>

  <title>References | Reverse Flow</title>

  <link rel="stylesheet" href="css/base.css?v=build-6" />
  <link rel="stylesheet" href="css/components.css?v=flash-3" />
  <link rel="stylesheet" href="css/calculators.css?v=flash-3" />
  <link rel="stylesheet" href="css/support.css?v=build-14" />
  <link rel="stylesheet" href="css/responsive.css?v=build-11" />
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1 class="app-header-title">Reverse Flow</h1>
        <p class="app-header-subtitle">
          Fire Hydraulics
        </p>
      </div>
    </div>
  </header>

  <main id="referencesPage">
    <nav class="page-nav" aria-label="Primary">
      <a class="reset-button nav-action-button nav-button-link" href="index.html">Calculator</a>
      <a class="reset-button nav-action-button nav-button-link active" href="tools.html">Tools</a>
      <a class="reset-button nav-action-button nav-button-link" href="settings.html">Settings</a>
    </nav>

    <section class="card app-view-panel">
      <div class="form-grid">
        <div class="field full">
          <label>References</label>
          <p class="helper">
            Manufacturer information, training partners, and training resources for fire hydraulics.
          </p>
        </div>

        <div id="referencesList" class="references-list" aria-live="polite"></div>
      </div>
    </section>

    <p class="version-footer">
      Reverse Flow: Fire Hydraulics © 2026
    </p>
  </main>

  <script src="js/constants.js?v=build-6"></script>
  <script src="js/services/entitlement.js?v=build-2"></script>
  <script>
    window.__reverseFlowReferencesLocked =
      typeof guardToolsAccess === "function" &&
      !guardToolsAccess({
        safeUrl: "index.html",
        redirectDelayMs: 250,
        reason: "references-page-load"
      });
  </script>
  <script src="js/data/references.js?v=manufacturers-2"></script>
  <script>
    if (!window.__reverseFlowReferencesLocked) {
    const referencesList = document.getElementById("referencesList");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getReferenceData() {
      return typeof referencesData === "object" && referencesData
        ? {
            manufacturers: referencesData.manufacturers || { hose: [], equipment: [] },
            trainingPartners: referencesData.trainingPartners || [],
            trainingResources: referencesData.trainingResources || []
          }
        : { manufacturers: { hose: [], equipment: [] }, trainingPartners: [], trainingResources: [] };
    }

    function getRoute() {
      const params = new URLSearchParams(window.location.search);
      return {
        section: params.get("section"),
        id: params.get("id")
      };
    }

    function getReferenceUrl(section, id) {
      const params = new URLSearchParams({ section, id });
      return `references.html?${params.toString()}`;
    }

    function getFrictionLossChartUrl() {
      return "tools.html?calculator=friction-loss-chart";
    }

    function createReferenceLinkCard(title, helper, href, actionText = "Open") {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-nav-card";
      card.innerHTML = `
        <div>
          <strong>${escapeHtml(title)}</strong>
          <p class="helper">${escapeHtml(helper)}</p>
        </div>
        <a class="reset-button reference-open-button" href="${escapeHtml(href)}">
          ${escapeHtml(actionText)}
        </a>
      `;
      return card;
    }

    function createTrainingResourcesEmptyCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>Training Resources Coming Soon</strong>
          <p class="helper">
            This section will include fire hydraulics training material, reference guides, and operational resources as they are developed and reviewed.
          </p>
        </div>
      `;
      return card;
    }

    function createManufacturerEmptyStateHtml() {
      return `
        <article class="hose-library-card reference-card reference-empty-card">
          <div>
            <strong>Manufacturer References Coming Soon</strong>
            <p class="helper">
              Manufacturer reference materials will be added here as published source data is reviewed.
            </p>
          </div>
        </article>
      `;
    }

    function getHoseManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.hose)
        ? data.manufacturers.hose
        : [];
    }

    function getEquipmentManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.equipment)
        ? data.manufacturers.equipment
        : [];
    }

    function getManufacturerCount(data) {
      return getHoseManufacturers(data).length + getEquipmentManufacturers(data).length;
    }

    function createCollapsedSection(title, helper, bodyHtml) {
      const section = document.createElement("details");
      section.className = "settings-tool-card collapsible-settings-card reference-section-card";
      section.innerHTML = `
        <summary>
          <span>
            <strong>${escapeHtml(title)}</strong>
            <span class="helper">${escapeHtml(helper)}</span>
          </span>
        </summary>
        <div class="collapsible-card-body">
          ${bodyHtml}
        </div>
      `;
      return section;
    }

    function createReferenceLinkList(items, section) {
      return items.map(item => `
        <article class="hose-library-card reference-card reference-nav-card">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <p class="helper">${escapeHtml(item.helper)}</p>
          </div>
          <a class="reset-button reference-open-button" href="${escapeHtml(getReferenceUrl(section, item.id))}">
            ${escapeHtml(item.actionText || "Open")}
          </a>
        </article>
      `).join("");
    }

    function createManufacturerWebsiteCard(manufacturer) {
      if (!manufacturer.websiteUrl) {
        return "";
      }

      return `
        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Official Website</strong>
            <p class="helper">${escapeHtml(manufacturer.websiteUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.websiteUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Website
          </a>
        </article>
      `;
    }

    function createTrainingPartnerLogo(partner) {
      if (!partner.logo) {
        return "";
      }

      return `
        <img
          class="reference-partner-logo"
          src="${escapeHtml(partner.logo)}"
          alt="${escapeHtml(partner.name)} logo"
          loading="lazy"
        />
      `;
    }

    function createTrainingPartnerContactCard(partner) {
      const hasEmail = !!partner.contactEmail;
      const hasWebsite = !!partner.websiteUrl;

      return `
        <article class="hose-library-card reference-card reference-website-card reference-partner-contact-card">
          <div>
            <strong>Contact</strong>
            <p class="helper">
              ${hasEmail
                ? `Interested training organizations can email ${escapeHtml(partner.contactEmail)}.`
                : "Contact information has not been added yet."}
            </p>
          </div>
          <div class="reference-partner-actions">
            ${hasEmail
              ? `
                <a
                  class="reset-button reference-open-button"
                  href="mailto:${escapeHtml(partner.contactEmail)}"
                >
                  Contact Reverse Flow
                </a>
              `
              : ""}
            ${hasWebsite
              ? `
                <a
                  class="reset-button reference-open-button"
                  href="${escapeHtml(partner.websiteUrl)}"
                  target="_blank"
                  rel="noopener"
                >
                  Visit Website
                </a>
              `
              : ""}
          </div>
        </article>
      `;
    }

    function createTrainingPartnerSpecialties(partner) {
      if (!Array.isArray(partner.specialties) || partner.specialties.length === 0) {
        return `<p class="helper">Specialties coming soon.</p>`;
      }

      return `
        <div class="reference-specialty-tags" aria-label="Training partner specialties">
          ${partner.specialties.map(specialty => `
            <span>${escapeHtml(specialty)}</span>
          `).join("")}
        </div>
      `;
    }

    function createCategoryList(categories) {
      if (!Array.isArray(categories) || categories.length === 0) {
        return `<p class="helper">No categories added yet.</p>`;
      }

      return `
        <div class="reference-category-list">
          ${categories.map(category => `
            <details class="hose-library-card reference-category-card collapsible-settings-card">
              <summary>
                <span>
                  <strong>${escapeHtml(category)}</strong>
                  <span class="helper">Product references coming soon.</span>
                </span>
              </summary>
              <div class="collapsible-card-body">
                <p class="helper">Manufacturer resources and product reference content will live here.</p>
              </div>
            </details>
          `).join("")}
        </div>
      `;
    }

    function renderOverview(data) {
      referencesList.innerHTML = "";
      const manufacturerCount = getManufacturerCount(data);
      const manufacturerBody = `
        <article class="hose-library-card reference-card reference-nav-card">
          <div>
            <strong>Manufacturers</strong>
            <p class="helper">Hose and equipment manufacturer references for supported Reverse Flow products.</p>
          </div>
          <a class="reset-button reference-open-button" href="references.html?section=manufacturers">
            Open
          </a>
        </article>
      `;

      const trainingPartnersBody = data.trainingPartners.length
        ? createReferenceLinkList(
            data.trainingPartners.map(partner => ({
              id: partner.id,
              name: partner.name,
              helper: partner.subtitle || "Coming soon",
              actionText: "View Partner"
            })),
            "training-partner"
          )
        : `
            <article class="hose-library-card reference-card reference-empty-card">
              <div>
                <strong>Training Partners Coming Soon</strong>
                <p class="helper">Fire service training organizations and instructors will be added here after review.</p>
              </div>
              <a class="reset-button reference-open-button" href="references.html?section=training-partners">
                Open
              </a>
            </article>
          `;

      referencesList.appendChild(
        createCollapsedSection(
          "Manufacturers",
          manufacturerCount
            ? `${manufacturerCount} manufacturer resource ${manufacturerCount === 1 ? "page" : "pages"}`
            : "Manufacturer reference materials coming soon",
          manufacturerBody
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Training Partners",
          "Fire service training organizations and instructors focused on pump operations, hydraulics, water supply, and related disciplines.",
          trainingPartnersBody
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Training Resources",
          "Fire hydraulics training material coming soon",
          `
            <article class="hose-library-card reference-card reference-nav-card">
              <div>
                <strong>Training Resources Coming Soon</strong>
                <p class="helper">This section will include fire hydraulics training material, reference guides, and operational resources as they are developed and reviewed.</p>
              </div>
              <a class="reset-button reference-open-button" href="references.html?section=training-resources">
                Open
              </a>
            </article>
          `
        )
      );

      referencesList.appendChild(
        createCollapsedSection(
          "Friction Loss Chart",
          "Generate a reference chart from your current default hose coefficients.",
          `
            <article class="hose-library-card reference-card reference-nav-card">
              <div>
                <strong>Friction Loss Chart</strong>
                <p class="helper">Generate a friction loss reference chart from your current default hose coefficients.</p>
              </div>
              <a class="reset-button reference-open-button" href="${escapeHtml(getFrictionLossChartUrl())}">
                Open
              </a>
            </article>
          `
        )
      );
    }

    function renderManufacturers(data) {
      const hoseManufacturers = getHoseManufacturers(data);
      const equipmentManufacturers = getEquipmentManufacturers(data);
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html">
            Back to References
          </a>
          <h2>Manufacturers</h2>
          <p class="helper">Browse manufacturer reference pages by category.</p>
        </div>
      `;

      referencesList.appendChild(
        createReferenceLinkCard(
          "Hose Manufacturers",
          hoseManufacturers.length
            ? `${hoseManufacturers.length} hose manufacturer reference page`
            : "Hose manufacturer references coming soon",
          "references.html?section=hose-manufacturers",
          "Open"
        )
      );

      referencesList.appendChild(
        createReferenceLinkCard(
          "Equipment Manufacturers",
          equipmentManufacturers.length
            ? `${equipmentManufacturers.length} equipment manufacturer reference page`
            : "Equipment manufacturer references coming soon",
          "references.html?section=equipment-manufacturers",
          "Open"
        )
      );
    }

    function renderHoseManufacturers(data) {
      const hoseManufacturers = getHoseManufacturers(data);
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=manufacturers">
            Back to Manufacturers
          </a>
          <h2>Hose Manufacturers</h2>
          <p class="helper">Published hose data and source links by manufacturer.</p>
        </div>
      `;

      if (!hoseManufacturers.length) {
        referencesList.insertAdjacentHTML("beforeend", createManufacturerEmptyStateHtml());
        return;
      }

      hoseManufacturers.forEach(manufacturer => {
        referencesList.appendChild(
          createReferenceLinkCard(
            manufacturer.name,
            `${manufacturer.hoseData.length} published hose data rows`,
            getReferenceUrl("hose-manufacturer", manufacturer.id),
            "View Data"
          )
        );
      });
    }

    function createEquipmentSpecificationTable(category) {
      const columns = Array.isArray(category.columns) ? category.columns : [];
      const rows = Array.isArray(category.rows) ? category.rows : [];

      if (!columns.length || !rows.length) {
        return `<p class="helper">Product specifications coming soon.</p>`;
      }

      return `
        <div class="reference-equipment-table-wrap">
          <table class="reference-equipment-table">
            <thead>
              <tr>
                ${columns.map(column => `<th>${escapeHtml(column)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  ${columns.map((column, index) => `
                    <td data-label="${escapeHtml(column)}">${escapeHtml(formatReferenceValue(row[index]))}</td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function createEquipmentNotes(notes) {
      if (!Array.isArray(notes) || notes.length === 0) {
        return "";
      }

      return `
        <div class="reference-equipment-notes">
          <strong>Reverse Flow Notes</strong>
          <ul>
            ${notes.map(note => `<li>${escapeHtml(note)}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function createEquipmentCategoryCards(manufacturer) {
      const categories = Array.isArray(manufacturer.categories)
        ? manufacturer.categories
        : [];

      if (!categories.length) {
        return `<p class="helper">Product categories coming soon.</p>`;
      }

      return categories.map(category => `
        <details class="hose-library-card reference-equipment-category-card collapsible-settings-card">
          <summary>
            <span>
              <strong>${escapeHtml(category.name)}</strong>
              <span class="helper">${escapeHtml(category.helper || "Product specifications")}</span>
            </span>
          </summary>
          <div class="collapsible-card-body reference-equipment-category-body">
            ${createEquipmentSpecificationTable(category)}
            ${createEquipmentNotes(category.notes)}
          </div>
        </details>
      `).join("");
    }

    function renderEquipmentManufacturers(data) {
      const equipmentManufacturers = getEquipmentManufacturers(data);
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=manufacturers">
            Back to Manufacturers
          </a>
          <h2>Equipment Manufacturers</h2>
          <p class="helper">Published product references and Reverse Flow integration notes by manufacturer.</p>
        </div>
      `;

      if (!equipmentManufacturers.length) {
        referencesList.insertAdjacentHTML(
          "beforeend",
          `
            <article class="hose-library-card reference-card reference-empty-card">
              <div>
                <strong>Equipment Manufacturers Coming Soon</strong>
                <p class="helper">Equipment manufacturer reference pages have not been added yet.</p>
              </div>
            </article>
          `
        );
        return;
      }

      equipmentManufacturers.forEach(manufacturer => {
        referencesList.appendChild(
          createReferenceLinkCard(
            manufacturer.name,
            `${manufacturer.categories.length} product ${manufacturer.categories.length === 1 ? "category" : "categories"}`,
            getReferenceUrl("equipment-manufacturer", manufacturer.id),
            "View Products"
          )
        );
      });
    }

    function renderEquipmentManufacturer(data, id) {
      const manufacturer = getEquipmentManufacturers(data).find(item => item.id === id);

      if (!manufacturer) {
        renderEquipmentManufacturers(data);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=equipment-manufacturers">
            Back to Equipment Manufacturers
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>About</strong>
          <p class="helper">${escapeHtml(manufacturer.about)}</p>
        </article>

        ${createManufacturerWebsiteCard(manufacturer)}

        <div class="references-group">
          <h2>Product Categories</h2>
          <p class="helper">${escapeHtml(manufacturer.categories.length)} published product ${manufacturer.categories.length === 1 ? "category" : "categories"}.</p>
        </div>

        <div class="reference-equipment-category-list">
          ${createEquipmentCategoryCards(manufacturer)}
        </div>

        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Source/reference note</strong>
            <p class="helper">${escapeHtml(manufacturer.sourceNote)}</p>
            <p class="helper">${escapeHtml(manufacturer.sourceUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.sourceUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Source
          </a>
        </article>
      `;
    }

    function formatReferenceValue(value) {
      return value === null || value === undefined || value === "" ? "Not published" : value;
    }

    function createHoseDataSourceLink(row) {
      return row.referenceUrl
        ? `
          <a href="${escapeHtml(row.referenceUrl)}" target="_blank" rel="noopener">
            Source
          </a>
        `
        : `<span class="reference-hose-data-source-missing">Not published</span>`;
    }

    function groupHoseDataByModel(rows) {
      return rows.reduce((groups, row) => {
        if (!groups[row.model]) {
          groups[row.model] = [];
        }
        groups[row.model].push(row);
        return groups;
      }, {});
    }

    function createHoseDataRows(rows) {
      return rows.map(row => `
        <div class="reference-hose-data-row">
          <span>
            <small>Trade Size</small>
            <strong>${escapeHtml(formatReferenceValue(row.tradeSize))}</strong>
          </span>
          <span>
            <small>Charged ID @50</small>
            <strong>${escapeHtml(formatReferenceValue(row.chargedId50))}</strong>
          </span>
          <span>
            <small>Charged ID @150</small>
            <strong>${escapeHtml(formatReferenceValue(row.chargedId150))}</strong>
          </span>
          <span>
            <small>FL Coefficient</small>
            <strong>${escapeHtml(formatReferenceValue(row.coefficient))}</strong>
          </span>
          ${createHoseDataSourceLink(row)}
        </div>
      `).join("");
    }

    function createHoseDataCards(manufacturer) {
      const groupedRows = groupHoseDataByModel(manufacturer.hoseData || []);
      return Object.entries(groupedRows).map(([model, rows]) => `
        <details class="hose-library-card reference-hose-data-card collapsible-settings-card">
          <summary>
            <span>
              <strong>${escapeHtml(model)}</strong>
              <span class="helper">${rows.length} ${rows.length === 1 ? "entry" : "entries"}</span>
            </span>
          </summary>
          <div class="collapsible-card-body reference-hose-data-grid">
            ${createHoseDataRows(rows)}
          </div>
        </details>
      `).join("");
    }

    function renderHoseManufacturer(data, id) {
      const manufacturer = getHoseManufacturers(data).find(item => item.id === id);

      if (!manufacturer) {
        renderHoseManufacturers(data);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=hose-manufacturers">
            Back to Hose Manufacturers
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>About</strong>
          <p class="helper">${escapeHtml(manufacturer.about)}</p>
        </article>

        ${createManufacturerWebsiteCard(manufacturer)}

        <div class="references-group">
          <h2>Published Hose Data</h2>
          <p class="helper">${escapeHtml(manufacturer.hoseData.length)} rows from the published source data.</p>
        </div>

        <div class="reference-hose-data-list">
          ${createHoseDataCards(manufacturer)}
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Reverse Flow Notes</strong>
          <p class="helper">${escapeHtml(manufacturer.notes)}</p>
        </article>

        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Source/reference note</strong>
            <p class="helper">${escapeHtml(manufacturer.sourceNote)}</p>
            <p class="helper">${escapeHtml(manufacturer.sourceUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.sourceUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Source
          </a>
        </article>
      `;
    }

    function renderTrainingPartners(data) {
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html">
            Back to References
          </a>
          <h2>Training Partners</h2>
        </div>
      `;

      data.trainingPartners.forEach(partner => {
        referencesList.appendChild(
          createReferenceLinkCard(
            partner.name,
            partner.subtitle || "Coming soon",
            getReferenceUrl("training-partner", partner.id),
            "View Partner"
          )
        );
      });
    }

    function renderTrainingResources(data) {
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html">
            Back to References
          </a>
          <h2>Training Resources</h2>
        </div>
      `;

      referencesList.appendChild(createTrainingResourcesEmptyCard());
    }

    function renderManufacturer(data, id) {
      const manufacturer = [
        ...getHoseManufacturers(data),
        ...getEquipmentManufacturers(data)
      ].find(item => item.id === id);

      if (!manufacturer) {
        renderOverview(data);
        return;
      }

      if (getHoseManufacturers(data).some(item => item.id === id)) {
        renderHoseManufacturer(data, id);
        return;
      }

      if (getEquipmentManufacturers(data).some(item => item.id === id)) {
        renderEquipmentManufacturer(data, id);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=manufacturers">
            Back to Manufacturers
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
          <p class="helper">Manufacturer resources and product references.</p>
        </div>
        ${createManufacturerWebsiteCard(manufacturer)}
        ${createCategoryList(manufacturer.categories)}
      `;
    }

    function renderTrainingPartner(data, id) {
      const partner = data.trainingPartners.find(item => item.id === id);

      if (!partner) {
        renderTrainingPartners(data);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=training-partners">
            Back to Training Partners
          </a>
          <div class="reference-partner-header${partner.logo ? "" : " reference-partner-header-no-logo"}">
            ${createTrainingPartnerLogo(partner)}
            <div class="reference-partner-title-copy">
              <h2>${escapeHtml(partner.name)}</h2>
              <p class="helper">${escapeHtml(partner.description)}</p>
            </div>
          </div>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Service Area</strong>
          <p class="helper">${escapeHtml(partner.serviceArea || "Service area coming soon.")}</p>
        </article>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Specialties</strong>
          ${createTrainingPartnerSpecialties(partner)}
        </article>

        ${createTrainingPartnerContactCard(partner)}
      `;
    }

    function renderReferences() {
      const data = getReferenceData();
      const route = getRoute();

      if (route.section === "manufacturers") {
        renderManufacturers(data);
        return;
      }

      if (route.section === "hose-manufacturers") {
        renderHoseManufacturers(data);
        return;
      }

      if (route.section === "equipment-manufacturers") {
        renderEquipmentManufacturers(data);
        return;
      }

      if (route.section === "hose-manufacturer") {
        renderHoseManufacturer(data, route.id);
        return;
      }

      if (route.section === "equipment-manufacturer") {
        renderEquipmentManufacturer(data, route.id);
        return;
      }

      if (route.section === "training-partners") {
        renderTrainingPartners(data);
        return;
      }

      if (route.section === "training-partner") {
        renderTrainingPartner(data, route.id);
        return;
      }

      if (route.section === "training-resources") {
        renderTrainingResources(data);
        return;
      }

      if (route.section === "manufacturer") {
        renderManufacturer(data, route.id);
        return;
      }

      renderOverview(data);
    }

    renderReferences();
    }
  </script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
