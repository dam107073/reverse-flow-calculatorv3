  <script>
    function syncReferencesPrimaryNav() {
      const activeHref = "resources.html";
      document.querySelectorAll(".page-nav a").forEach(link => {
        const isActive = link.getAttribute("href") === activeHref;
        link.classList.toggle("active", isActive);
        if (isActive) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      const title = document.getElementById("referencesShellTitle");
      const helper = document.getElementById("referencesShellHelper");
      if (title) title.textContent = "Resources";
      if (helper) {
        helper.textContent = "Reference, training, and educational content for Reverse Flow.";
      }
    }

    syncReferencesPrimaryNav();
  </script>
  <script src="js/data/references.js?v=training-directory-mock-1"></script>
  <script>
    const referencesList = document.getElementById("referencesList");
    const TRAINING_DIRECTORY_API_URL = "https://reverse-flow.app/api/training-directory/listings";
    const TRAINING_DIRECTORY_PROFILE_BASE_URL = "https://reverse-flow.app/training-directory";
    const TRAINING_DIRECTORY_SUBMIT_URL = "https://reverse-flow.app/training-directory/submit/";
    const TRAINING_DIRECTORY_CACHE_KEY = "reverseFlowTrainingDirectoryListings:v1";
    const ENABLE_PUBLISHED_HOSE_REFERENCES = false;
    const PUBLISHED_HOSE_REFERENCES_API_URL = "https://reverse-flow.app/api/hose-references/published";
    const PUBLISHED_HOSE_REFERENCES_CACHE_KEY = "reverseFlowPublishedHoseReferences:v1";
    const PUBLISHED_HOSE_REFERENCES_SCHEMA_VERSION = 1;
    const publishedHoseReferencesState = {
      status: "disabled",
      hose: null
    };
    const trainingDirectoryLiveState = {
      status: "idle",
      listings: [],
      message: ""
    };
    const trainingDirectoryFilterState = {
      search: "",
      topic: "",
      location: ""
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getBundledReferenceData() {
      return typeof referencesData === "object" && referencesData
        ? {
            manufacturers: referencesData.manufacturers || { hose: [], equipment: [] },
            trainingDirectoryTopics: referencesData.trainingDirectoryTopics || [],
            trainingPartners: referencesData.trainingPartners || [],
            trainingResources: referencesData.trainingResources || []
          }
        : { manufacturers: { hose: [], equipment: [] }, trainingDirectoryTopics: [], trainingPartners: [], trainingResources: [] };
    }

    function getReferenceData() {
      const bundledData = getBundledReferenceData();
      const bundledManufacturers = bundledData.manufacturers || { hose: [], equipment: [] };
      const bundledHose = Array.isArray(bundledManufacturers.hose)
        ? bundledManufacturers.hose
        : [];
      const publishedHose = ENABLE_PUBLISHED_HOSE_REFERENCES &&
        Array.isArray(publishedHoseReferencesState.hose)
          ? publishedHoseReferencesState.hose
          : null;
      const mergedHose = publishedHose
        ? mergePublishedHoseReferences(bundledHose, publishedHose)
        : bundledHose;

      return {
        manufacturers: {
          ...bundledManufacturers,
          hose: mergedHose,
          equipment: Array.isArray(bundledManufacturers.equipment)
            ? bundledManufacturers.equipment
            : []
        },
        trainingDirectoryTopics: bundledData.trainingDirectoryTopics,
        trainingPartners: bundledData.trainingPartners,
        trainingResources: bundledData.trainingResources
      };
    }

    function getRoute() {
      const params = new URLSearchParams(window.location.search);
      return {
        section: params.get("section"),
        id: params.get("id")
      };
    }

    function getReferenceUrl(section, id) {
      const params = new URLSearchParams({ section, id });
      return `references.html?${params.toString()}`;
    }

    function createReferenceLinkCard(title, helper, href, actionText = "Open") {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-nav-card";
      card.innerHTML = `
        <div>
          <strong>${escapeHtml(title)}</strong>
          <p class="helper">${escapeHtml(helper)}</p>
        </div>
        <a class="reset-button reference-open-button" href="${escapeHtml(href)}">
          ${escapeHtml(actionText)}
        </a>
      `;
      return card;
    }

    function createTrainingResourcesEmptyCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>Training Resources Coming Soon</strong>
          <p class="helper">
            This section will include fire hydraulics training material, reference guides, and operational resources as they are developed and reviewed.
          </p>
        </div>
      `;
      return card;
    }

    function createTrainingDirectoryEmptyCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>Training Directory listings are coming soon.</strong>
          <p class="helper">This section will help users discover reviewed fire service training resources and instructor listings.</p>
        </div>
      `;
      return card;
    }

    function createTrainingDirectoryStatusCard(title, message, modifierClass = "") {
      const card = document.createElement("article");
      card.className = `hose-library-card reference-card reference-empty-card${modifierClass ? ` ${modifierClass}` : ""}`;
      card.innerHTML = `
        <div>
          <strong>${escapeHtml(title)}</strong>
          ${message ? `<p class="helper">${escapeHtml(message)}</p>` : ""}
        </div>
      `;
      return card;
    }

    function createTrainingDirectoryNoResultsCard() {
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-empty-card";
      card.innerHTML = `
        <div>
          <strong>No training providers match those filters.</strong>
          <p class="helper">Clear the filters to return to all Training Directory listings.</p>
        </div>
        <button class="reset-button reference-open-button" type="button" data-training-filter-reset>
          Reset
        </button>
      `;
      return card;
    }

    function createManufacturerEmptyStateHtml() {
      return `
        <article class="hose-library-card reference-card reference-empty-card">
          <div>
            <strong>Manufacturer References Coming Soon</strong>
            <p class="helper">
              Manufacturer reference materials will be added here as published source data is reviewed.
            </p>
          </div>
        </article>
      `;
    }

    function getHoseManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.hose)
        ? data.manufacturers.hose
        : [];
    }

    function normalizeHoseReferenceKey(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function getHoseReferenceRowKey(row) {
      if (!row || typeof row !== "object") return "";
      if (row.id) return `id:${normalizeHoseReferenceKey(row.id)}`;
      if (row.referenceId) return `referenceId:${normalizeHoseReferenceKey(row.referenceId)}`;
      if (row.variantId) return `variantId:${normalizeHoseReferenceKey(row.variantId)}`;

      const model = normalizeHoseReferenceKey(row.model);
      const tradeSize = normalizeHoseReferenceKey(row.tradeSize);
      return model && tradeSize ? `model:${model}|tradeSize:${tradeSize}` : "";
    }

    function mergeHoseReferenceRows(bundledRows, publishedRows) {
      const mergedRows = Array.isArray(bundledRows)
        ? bundledRows.map(row => ({ ...row }))
        : [];
      const rowIndexByKey = new Map();

      mergedRows.forEach((row, index) => {
        const key = getHoseReferenceRowKey(row);
        if (key && !rowIndexByKey.has(key)) {
          rowIndexByKey.set(key, index);
        }
      });

      if (!Array.isArray(publishedRows)) return mergedRows;

      publishedRows.forEach(row => {
        const key = getHoseReferenceRowKey(row);
        if (key && rowIndexByKey.has(key)) {
          const index = rowIndexByKey.get(key);
          mergedRows[index] = { ...mergedRows[index], ...row };
          return;
        }

        const nextIndex = mergedRows.length;
        mergedRows.push({ ...row });
        if (key) rowIndexByKey.set(key, nextIndex);
      });

      return mergedRows;
    }

    function mergePublishedHoseReferences(bundledHose, publishedHose) {
      const mergedHose = Array.isArray(bundledHose)
        ? bundledHose.map(manufacturer => ({
            ...manufacturer,
            hoseData: Array.isArray(manufacturer.hoseData)
              ? manufacturer.hoseData.map(row => ({ ...row }))
              : []
          }))
        : [];
      const manufacturerIndexById = new Map();

      mergedHose.forEach((manufacturer, index) => {
        if (manufacturer && manufacturer.id && !manufacturerIndexById.has(manufacturer.id)) {
          manufacturerIndexById.set(manufacturer.id, index);
        }
      });

      if (!Array.isArray(publishedHose) || !publishedHose.length) return mergedHose;

      publishedHose.forEach(manufacturer => {
        if (!manufacturer || !manufacturer.id) return;

        if (manufacturerIndexById.has(manufacturer.id)) {
          const index = manufacturerIndexById.get(manufacturer.id);
          const bundledManufacturer = mergedHose[index] || {};
          mergedHose[index] = {
            ...bundledManufacturer,
            ...manufacturer,
            hoseData: mergeHoseReferenceRows(
              bundledManufacturer.hoseData,
              manufacturer.hoseData
            )
          };
          return;
        }

        manufacturerIndexById.set(manufacturer.id, mergedHose.length);
        mergedHose.push({
          ...manufacturer,
          hoseData: Array.isArray(manufacturer.hoseData)
            ? manufacturer.hoseData.map(row => ({ ...row }))
            : []
        });
      });

      return mergedHose;
    }

    function getEquipmentManufacturers(data) {
      return Array.isArray(data.manufacturers && data.manufacturers.equipment)
        ? data.manufacturers.equipment
        : [];
    }

    function getManufacturerCount(data) {
      return getHoseManufacturers(data).length + getEquipmentManufacturers(data).length;
    }

    function getTrainingDirectoryListings(data) {
      if (Array.isArray(trainingDirectoryLiveState.listings)) {
        return trainingDirectoryLiveState.listings;
      }

      return Array.isArray(data.trainingPartners)
        ? data.trainingPartners.filter(item => item.status !== "placeholder")
        : [];
    }

    function getFirstTextValue(...values) {
      for (const value of values) {
        if (typeof value !== "string") continue;
        const trimmed = value.trim();
        if (trimmed) return trimmed;
      }
      return "";
    }

    function getArrayValue(value) {
      return Array.isArray(value)
        ? value.map(item => String(item || "").trim()).filter(Boolean)
        : [];
    }

    function resolveTrainingDirectoryWebsiteUrl(pathOrUrl) {
      const text = String(pathOrUrl || "").trim();
      if (!text) return "";

      try {
        return new URL(text, "https://reverse-flow.app").href;
      } catch {
        return "";
      }
    }

    function normalizeTrainingDirectoryListing(listing) {
      listing = listing || {};
      const slug = getFirstTextValue(listing.slug, listing.listingSlug);
      const title = getFirstTextValue(
        listing.title,
        listing.publicTitle,
        listing.public_title,
        listing.organizationName,
        listing.organization_name,
        listing.instructorName,
        listing.instructor_name,
        "Training Listing"
      );
      const specialties = getArrayValue(listing.specialties).length
        ? getArrayValue(listing.specialties)
        : getArrayValue(listing.specialtyIds || listing.specialty_ids);
      const statesServed = getArrayValue(listing.statesServed || listing.states_served);

      return {
        id: getFirstTextValue(listing.id, slug, title),
        slug,
        name: title,
        description: getFirstTextValue(
          listing.appSummary,
          listing.app_summary,
          listing.summary,
          listing.shortSummary,
          listing.publicProfile,
          listing.public_profile
        ),
        serviceArea: getFirstTextValue(
          listing.serviceArea,
          listing.service_area_summary,
          listing.serviceAreaSummary
        ),
        statesServed,
        topics: specialties,
        logoUrl: resolveTrainingDirectoryWebsiteUrl(listing.logoUrl || listing.logo_url || listing.logo_path),
        profileUrl: slug
          ? `${TRAINING_DIRECTORY_PROFILE_BASE_URL}/${encodeURIComponent(slug)}`
          : ""
      };
    }

    function loadCachedTrainingDirectoryListings() {
      try {
        const cached = JSON.parse(localStorage.getItem(TRAINING_DIRECTORY_CACHE_KEY) || "null");
        const listings = Array.isArray(cached && cached.listings)
          ? cached.listings.map(normalizeTrainingDirectoryListing).filter(listing => listing.slug)
          : [];
        return listings;
      } catch {
        return [];
      }
    }

    function saveTrainingDirectoryListingsToCache(listings) {
      try {
        localStorage.setItem(
          TRAINING_DIRECTORY_CACHE_KEY,
          JSON.stringify({
            cachedAt: new Date().toISOString(),
            listings
          })
        );
      } catch {
        // Cache writes are best-effort; the live directory should still render.
      }
    }

    function isPublishedHoseReferenceRow(row) {
      return row &&
        typeof row.model === "string" &&
        typeof row.tradeSize === "string" &&
        typeof row.chargedId50 === "string" &&
        typeof row.chargedId150 === "string" &&
        typeof row.coefficient === "string" &&
        typeof row.referenceUrl === "string";
    }

    function isPublishedHoseManufacturer(manufacturer) {
      return manufacturer &&
        typeof manufacturer.id === "string" &&
        typeof manufacturer.name === "string" &&
        typeof manufacturer.shortName === "string" &&
        typeof manufacturer.websiteUrl === "string" &&
        typeof manufacturer.sourceUrl === "string" &&
        typeof manufacturer.about === "string" &&
        typeof manufacturer.notes === "string" &&
        typeof manufacturer.sourceNote === "string" &&
        Array.isArray(manufacturer.hoseData) &&
        manufacturer.hoseData.every(isPublishedHoseReferenceRow);
    }

    function normalizePublishedHoseReferencesPayload(body) {
      const hose = body &&
        body.manufacturers &&
        Array.isArray(body.manufacturers.hose)
          ? body.manufacturers.hose
          : [];

      if (!hose.length || !hose.every(isPublishedHoseManufacturer)) {
        return null;
      }

      return hose;
    }

    function loadCachedPublishedHoseReferences() {
      try {
        const cached = JSON.parse(localStorage.getItem(PUBLISHED_HOSE_REFERENCES_CACHE_KEY) || "null");
        if (!cached || cached.schemaVersion !== PUBLISHED_HOSE_REFERENCES_SCHEMA_VERSION) {
          return null;
        }
        return normalizePublishedHoseReferencesPayload(cached);
      } catch {
        return null;
      }
    }

    function savePublishedHoseReferencesToCache(hose) {
      try {
        localStorage.setItem(
          PUBLISHED_HOSE_REFERENCES_CACHE_KEY,
          JSON.stringify({
            schemaVersion: PUBLISHED_HOSE_REFERENCES_SCHEMA_VERSION,
            cachedAt: new Date().toISOString(),
            source: "published-api",
            manufacturers: { hose }
          })
        );
      } catch {
        // Cache writes are best-effort; bundled references remain the fallback.
      }
    }

    function parsePublishedHoseReferencesApiBody(responseBody) {
      if (typeof responseBody === "string") {
        return JSON.parse(responseBody);
      }

      return responseBody || {};
    }

    function fetchPublishedHoseReferencesFromApi() {
      const capacitorHttp = getCapacitorHttpPlugin();
      if (isNativeCapacitorReferenceApp() && capacitorHttp && typeof capacitorHttp.get === "function") {
        return capacitorHttp.get({
          url: PUBLISHED_HOSE_REFERENCES_API_URL,
          headers: { Accept: "application/json" },
          responseType: "json"
        }).then(response => {
          if (response.status < 200 || response.status >= 300) {
            throw new Error("Unable to load published Hose References.");
          }

          return parsePublishedHoseReferencesApiBody(response.data);
        });
      }

      return fetch(PUBLISHED_HOSE_REFERENCES_API_URL, {
        headers: { Accept: "application/json" },
        cache: "no-store"
      }).then(response => response.ok ? response.json() : Promise.reject(new Error("Unable to load published Hose References.")));
    }

    function applyPublishedHoseReferences(hose, status) {
      publishedHoseReferencesState.status = status;
      publishedHoseReferencesState.hose = hose;
      renderReferences();
    }

    function loadPublishedHoseReferences() {
      if (!ENABLE_PUBLISHED_HOSE_REFERENCES) return;

      const cachedHose = loadCachedPublishedHoseReferences();
      if (cachedHose) {
        applyPublishedHoseReferences(cachedHose, "cached");
      }

      const hasNativeHttp = !!getCapacitorHttpPlugin();
      const hasFetch = typeof fetch === "function";
      if (!hasFetch && !hasNativeHttp) {
        publishedHoseReferencesState.status = cachedHose ? "cached" : "offline";
        return;
      }

      publishedHoseReferencesState.status = "loading";
      fetchPublishedHoseReferencesFromApi()
        .then(body => {
          const hose = normalizePublishedHoseReferencesPayload(body);
          if (!hose) {
            throw new Error("Published Hose References payload was invalid.");
          }

          savePublishedHoseReferencesToCache(hose);
          applyPublishedHoseReferences(hose, "loaded");
        })
        .catch(error => {
          console.warn("Published Hose References unavailable.", error);
          publishedHoseReferencesState.status = cachedHose ? "cached" : "error";
        });
    }

    function refreshTrainingDirectoryRoute() {
      const route = getRoute();
      if (route.section === "training-partners") {
        renderTrainingPartners(getReferenceData());
      }
    }

    function getCapacitorHttpPlugin() {
      try {
        return window.Capacitor &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.CapacitorHttp;
      } catch {
        return null;
      }
    }

    function parseTrainingDirectoryApiBody(responseBody) {
      if (typeof responseBody === "string") {
        return JSON.parse(responseBody);
      }

      return responseBody || {};
    }

    function fetchTrainingDirectoryListingsFromApi() {
      const capacitorHttp = getCapacitorHttpPlugin();
      if (isNativeCapacitorReferenceApp() && capacitorHttp && typeof capacitorHttp.get === "function") {
        return capacitorHttp.get({
          url: TRAINING_DIRECTORY_API_URL,
          headers: { Accept: "application/json" },
          responseType: "json"
        }).then(response => {
          if (response.status < 200 || response.status >= 300) {
            throw new Error("Unable to load Training Directory listings.");
          }

          return parseTrainingDirectoryApiBody(response.data);
        });
      }

      return fetch(TRAINING_DIRECTORY_API_URL, {
        headers: { Accept: "application/json" },
        cache: "no-store"
      }).then(response => response.ok ? response.json() : Promise.reject(new Error("Unable to load Training Directory listings.")));
    }

    function loadTrainingDirectoryListings() {
      const hasNativeHttp = !!getCapacitorHttpPlugin();
      const hasFetch = typeof fetch === "function";
      if (trainingDirectoryLiveState.status !== "idle" || (!hasFetch && !hasNativeHttp)) {
        if (!hasFetch && !hasNativeHttp) {
          const cachedListings = loadCachedTrainingDirectoryListings();
          trainingDirectoryLiveState.status = cachedListings.length ? "cached" : "error";
          trainingDirectoryLiveState.listings = cachedListings;
          trainingDirectoryLiveState.message = cachedListings.length
            ? "Showing recently loaded listings."
            : "Training Directory listings could not be loaded right now. Check your connection and try again.";
        }
        return;
      }

      trainingDirectoryLiveState.status = "loading";
      fetchTrainingDirectoryListingsFromApi()
        .then(body => {
          const listings = Array.isArray(body && body.listings)
            ? body.listings.map(normalizeTrainingDirectoryListing).filter(listing => listing.slug)
            : [];
          trainingDirectoryLiveState.status = listings.length ? "loaded" : "empty";
          trainingDirectoryLiveState.listings = listings;
          trainingDirectoryLiveState.message = "";
          saveTrainingDirectoryListingsToCache(listings);
        })
        .catch(error => {
          console.warn("Training Directory listings unavailable.", error);
          const cachedListings = loadCachedTrainingDirectoryListings();
          trainingDirectoryLiveState.status = cachedListings.length ? "cached" : "error";
          trainingDirectoryLiveState.listings = cachedListings;
          trainingDirectoryLiveState.message = cachedListings.length
            ? "Showing recently loaded listings."
            : "Training Directory listings could not be loaded right now. Check your connection and try again.";
        })
        .finally(refreshTrainingDirectoryRoute);
    }

    function getTrainingDirectoryTopics(data, listings) {
      return Array.isArray(data.trainingDirectoryTopics) && data.trainingDirectoryTopics.length
        ? data.trainingDirectoryTopics
        : getUniqueTrainingFilterOptions(listings, "topics");
    }

    function getUniqueTrainingFilterOptions(listings, field) {
      return [...new Set(
        listings.flatMap(listing => Array.isArray(listing[field]) ? listing[field] : [])
          .map(value => String(value).trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));
    }

    function createFilterOptionList(options, selectedValue, allLabel) {
      return `
        <option value="">${escapeHtml(allLabel)}</option>
        ${options.map(option => `
          <option value="${escapeHtml(option)}"${option === selectedValue ? " selected" : ""}>
            ${escapeHtml(option)}
          </option>
        `).join("")}
      `;
    }

    function filterTrainingDirectoryListings(listings) {
      const searchTerm = trainingDirectoryFilterState.search.trim().toLowerCase();
      const selectedTopic = trainingDirectoryFilterState.topic;
      const selectedLocation = trainingDirectoryFilterState.location;

      return listings.filter(listing => {
        const topics = Array.isArray(listing.topics) ? listing.topics : [];
        const locations = Array.isArray(listing.locations) ? listing.locations : [];
        const searchableText = [
          listing.name,
          listing.contactName,
          listing.description,
          listing.fullDescription,
          listing.serviceArea,
          ...(Array.isArray(listing.statesServed) ? listing.statesServed : []),
          ...topics
        ].filter(Boolean).join(" ").toLowerCase();
        const matchesSearch = !searchTerm || searchableText.includes(searchTerm);
        const matchesTopic = !selectedTopic || topics.includes(selectedTopic);
        const matchesLocation = !selectedLocation || locations.includes(selectedLocation);
        return matchesSearch && matchesTopic && matchesLocation;
      });
    }

    function createTrainingDirectoryFilterCard(data, listings) {
      const topicOptions = getTrainingDirectoryTopics(data, listings);
      const locationOptions = getUniqueTrainingFilterOptions(listings, "locations");
      const hasActiveFilters =
        !!trainingDirectoryFilterState.search ||
        !!trainingDirectoryFilterState.topic ||
        !!trainingDirectoryFilterState.location;
      const card = document.createElement("article");
      card.className = "hose-library-card reference-card reference-filter-card";
      card.innerHTML = `
        <div class="reference-filter-fields">
          <label class="reference-search-field">

    function resolveReferenceAssetUrl(url) {
      try {
        return new URL(url, window.location.href).href;
      } catch {
        return url;
      }
    }

    function openReferenceExternalUrl(url) {
      const externalUrl = resolveReferenceAssetUrl(url);

    function isNativeCapacitorReferenceApp() {
      try {
        return !!(
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === "function" &&
          window.Capacitor.isNativePlatform()
        );
      } catch {
        return false;
      }
    }

    function createReferenceFileName(title, extension) {
      const normalizedTitle = String(title || "Datasheet")
        .replace(/[^A-Za-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 80) || "Datasheet";

      return `Reverse_Flow_HEN_${normalizedTitle}_Datasheet.${extension}`;
    }

    function blobToReferenceBase64Payload(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || "");
          const base64 = dataUrl.includes(",")
            ? dataUrl.slice(dataUrl.indexOf(",") + 1)
            : "";

          if (!base64) {
            reject(new Error("PDF base64 payload was empty."));
            return;
          }

          resolve(base64);
        };
        reader.onerror = () => reject(reader.error || new Error("PDF base64 conversion failed."));
        reader.readAsDataURL(blob);
      });
    }

    async function openReferencePdfNative(url, title) {
      const documentUrl = resolveReferenceAssetUrl(url);
      const plugins = window.Capacitor?.Plugins || {};
      const Filesystem = plugins.Filesystem;
      const Share = plugins.Share;

      if (!Filesystem || !Share) {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      let pdfBlob = null;
      try {
        const response = await fetch(documentUrl);
        if (!response.ok) {
          throw new Error(`PDF request failed with ${response.status}`);
        }
        pdfBlob = await response.blob();
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      let base64Data = "";
      try {
        base64Data = await blobToReferenceBase64Payload(
          pdfBlob.type === "application/pdf"
            ? pdfBlob
            : new Blob([pdfBlob], { type: "application/pdf" })
        );
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      const fileName = createReferenceFileName(title, "pdf");
      const path = `reference-datasheets/${fileName}`;
      let fileUri = "";

      try {
        const writeResult = await Filesystem.writeFile({
          path,
          data: base64Data,
          directory: "CACHE",
          recursive: true
        });
        fileUri = writeResult.uri || "";
      } catch {
        alert("Unable to open this datasheet on this device.");
        return;
      }

      try {
        await Share.share({
          title: title ? `${title} Datasheet` : "HEN Datasheet",
          files: [fileUri],
          dialogTitle: "Open Datasheet"
        });
      } catch {
        alert("Unable to open this datasheet on this device.");
      }
    }

    async function openReferenceDocument(url, title) {
      const documentUrl = resolveReferenceAssetUrl(url);

      if (isNativeCapacitorReferenceApp()) {
        await openReferencePdfNative(documentUrl, title);
        return;
      }

      const openedWindow = window.open(documentUrl, "_blank", "noopener");

      if (!openedWindow) {
        alert("Unable to open this datasheet on this device.");
      }
    }

        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=equipment-manufacturers">
            Back to Equipment References
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>About</strong>
          <p class="helper">${escapeHtml(manufacturer.about)}</p>
        </article>

        ${createManufacturerWebsiteCard(manufacturer)}

        <div class="references-group">
          <h2>Reference Specifications</h2>
          <p class="helper">${escapeHtml(manufacturer.categories.length)} published product ${manufacturer.categories.length === 1 ? "category" : "categories"}.</p>
        </div>

        <div class="reference-equipment-category-list">
          ${createEquipmentCategoryCards(manufacturer)}
        </div>

        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Source</strong>
            <p class="helper">${escapeHtml(manufacturer.sourceNote)}</p>
            <p class="helper">${escapeHtml(manufacturer.sourceUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.sourceUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Source
          </a>
        </article>
      `;
    }

    function renderEquipmentCategory(data, categoryId) {
      const match = findEquipmentCategory(data, categoryId);

      if (!match) {
        renderEquipmentManufacturers(data);
        return;
      }

      const { manufacturer, category } = match;
      const products = getEquipmentCategoryProducts(manufacturer, category);

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="${escapeHtml(getReferenceUrl("equipment-manufacturer", manufacturer.id))}">
            Back to ${escapeHtml(manufacturer.name)}
          </a>
          <h2>${escapeHtml(category.name)}</h2>
          <p class="helper">${escapeHtml(category.helper || "Product references")}</p>
        </div>
      `;

      if (!products.length) {
        referencesList.insertAdjacentHTML(
          "beforeend",
          `
            <article class="hose-library-card reference-card reference-empty-card">
              <div>
                <strong>Product References Coming Soon</strong>
                <p class="helper">Product references have not been added for this category yet.</p>
              </div>
            </article>
          `
        );
        return;
      }

      products.forEach(product => {
        referencesList.appendChild(
          createReferenceLinkCard(
            product.name,
            product.description || "View datasheet and manufacturer website.",
            getReferenceUrl("equipment-product", product.id),
            "Open Product"
          )
        );
      });
    }

    function renderEquipmentProduct(data, productId) {
      const match = findEquipmentProduct(data, productId);

      if (!match) {
        renderEquipmentManufacturers(data);
        return;
      }

      const { manufacturer, category, product } = match;
      const websiteUrl = product.websiteUrl || manufacturer.productReferenceUrl || manufacturer.websiteUrl;
      const datasheetPdfUrl = resolveReferenceAssetUrl(product.datasheetPdfUrl);
      const productDescription = product.description
        ? `<p class="helper">${escapeHtml(product.description)}</p>`
        : "";

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="${escapeHtml(getReferenceUrl("equipment-category", category ? category.id : manufacturer.id))}">
            Back to ${escapeHtml(category ? category.name : manufacturer.name)}
          </a>
          <h2>${escapeHtml(product.name)}</h2>
          ${productDescription}
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Basic Specifications</strong>
          ${createEquipmentProductSpecList(product.specs)}
        </article>

        ${createEquipmentProductNotes(product.notes)}

        <div class="references-group">
          <h2>Product Resources</h2>
        </div>

        <article class="hose-library-card reference-card reference-website-card reference-product-resource-card">
          <div>
            <strong>Datasheet</strong>
            <p class="helper">Open the official HEN datasheet with the device document viewer.</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(datasheetPdfUrl)}"
            data-reference-document-url="${escapeHtml(datasheetPdfUrl)}"
            data-reference-document-title="${escapeHtml(product.name)}"
            target="_blank"
            rel="noopener"
          >
            View Datasheet
          </a>
        </article>

        <article class="hose-library-card reference-card reference-website-card reference-product-resource-card">
          <div>
            <strong>HEN Website</strong>
            <p class="helper">${escapeHtml(websiteUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(websiteUrl)}"
            data-reference-external-url="${escapeHtml(websiteUrl)}"
            target="_blank"
            rel="noopener"
          >
            Visit HEN Website
          </a>
        </article>
      `;
    }

    function formatReferenceValue(value) {
      return value === null || value === undefined || value === "" ? "Not published" : value;
    }

    function createHoseDataSourceLink(row) {
      return row.referenceUrl
        ? `
          <a href="${escapeHtml(row.referenceUrl)}" target="_blank" rel="noopener">
            Source
          </a>
        `
        : `<span class="reference-hose-data-source-missing">Not published</span>`;
    }

    function getProfileHoseIdFromTradeSize(tradeSize) {
      const normalized = String(tradeSize || "")
        .replaceAll('"', "")
        .trim();
      const tradeSizeMap = {
        "1": "1",
        "1.5": "1.5",
        "1.75": "1.75",
        "1.88": "1.88",
        "2": "2",
        "2.25": "2.25",
        "2.5": "2.5",
        "3": "3",
        "4": "4",
        "5": "5"
      };

      return tradeSizeMap[normalized] || "";
    }

    function numberOrNull(value) {
      const numberValue = Number(value);
      return Number.isFinite(numberValue) ? numberValue : null;
    }

    function loadMyHoseProfiles() {
      try {
        const saved = localStorage.getItem(CUSTOM_HOSE_PROFILES_KEY);
        const profiles = saved ? JSON.parse(saved) : [];
        return Array.isArray(profiles) ? profiles : [];
      } catch {
        return [];
      }
    }

    function saveMyHoseProfiles(profiles) {
      localStorage.setItem(CUSTOM_HOSE_PROFILES_KEY, JSON.stringify(profiles));
    }

    function addHoseReferenceToProfiles(button) {
      const manufacturerName = button.dataset.manufacturerName || "";
      const model = button.dataset.model || "";
      const tradeSize = button.dataset.tradeSize || "";
      const coefficient = numberOrNull(button.dataset.coefficient);

      if (!model || coefficient === null || coefficient <= 0) {
        alert("This hose reference row does not have enough published data to create a profile.");
        return;
      }

      const profileName = `${manufacturerName} ${model} ${tradeSize}`.replace(/\s+/g, " ").trim();
      const profiles = loadMyHoseProfiles();
      const duplicateProfile = profiles.find(profile =>
        profile.sourceType === "manufacturer-reference" &&
        profile.manufacturer === manufacturerName &&
        profile.model === model &&
        profile.tradeSize === tradeSize &&
        Number(profile.coefficient) === coefficient
      );

      if (duplicateProfile) {
        const confirmed = confirm(`${profileName} already exists in My Hose Profiles. Add another copy?`);
        if (!confirmed) return;
      }

      profiles.push({
        id: `profile-from-reference-${Date.now()}`,
        profileName,
        manufacturer: manufacturerName,
        model,
        sourceModel: model,
        tradeSize,
        appHoseId: getProfileHoseIdFromTradeSize(tradeSize),
        chargedId50: numberOrNull(button.dataset.chargedId50),
        chargedId150: numberOrNull(button.dataset.chargedId150),
        coefficient,
        referenceUrl: button.dataset.referenceUrl || "",
        notes: "Created from manufacturer reference data.",
        custom: true,
        customUse: "both",
        sourceType: "manufacturer-reference"
      });

      saveMyHoseProfiles(profiles);
      alert(`${profileName} was added to My Hose Profiles.`);
    }

    referencesList.addEventListener("click", event => {
      const documentLink = event.target.closest("[data-reference-document-url]");
      if (documentLink) {
        event.preventDefault();
        openReferenceDocument(
          documentLink.dataset.referenceDocumentUrl || documentLink.href,
          documentLink.dataset.referenceDocumentTitle || ""
        );
        return;
      }

      const externalLink = event.target.closest("[data-reference-external-url]");
      if (externalLink) {
        event.preventDefault();
        openReferenceExternalUrl(externalLink.dataset.referenceExternalUrl || externalLink.href);
        return;
      }

      const resetButton = event.target.closest("[data-training-filter-reset]");
      if (resetButton) {
        trainingDirectoryFilterState.search = "";
        trainingDirectoryFilterState.topic = "";
        trainingDirectoryFilterState.location = "";
        renderTrainingPartners(getReferenceData());
        return;
      }

      const button = event.target.closest("[data-add-hose-profile]");
      if (!button) return;

      addHoseReferenceToProfiles(button);
    });

    referencesList.addEventListener("change", event => {
      const filter = event.target.closest("[data-training-filter]");
      if (!filter) return;

      const filterType = filter.dataset.trainingFilter;
      if (filterType === "search") {
        trainingDirectoryFilterState.search = filter.value;
      }
      if (filterType === "topic") {
        trainingDirectoryFilterState.topic = filter.value;
      }
      if (filterType === "location") {
        trainingDirectoryFilterState.location = filter.value;
      }

      renderTrainingPartners(getReferenceData());
    });

    referencesList.addEventListener("input", event => {
      const filter = event.target.closest("[data-training-filter='search']");
      if (!filter) return;

      trainingDirectoryFilterState.search = filter.value;
      const cursorPosition = filter.selectionStart;
      renderTrainingPartners(getReferenceData());
      const searchInput = referencesList.querySelector("[data-training-filter='search']");
      if (searchInput) {
        searchInput.focus();
        if (typeof cursorPosition === "number") {
          searchInput.setSelectionRange(cursorPosition, cursorPosition);
        }
      }
    });

    function groupHoseDataByModel(rows) {
      return rows.reduce((groups, row) => {
        if (!groups[row.model]) {
          groups[row.model] = [];
        }
        groups[row.model].push(row);
        return groups;
      }, {});
    }

    function createHoseDataRows(rows, manufacturer) {
      return rows.map(row => `
        <div class="reference-hose-data-row">
          <span>
            <small>Trade Size</small>
            <strong>${escapeHtml(formatReferenceValue(row.tradeSize))}</strong>
          </span>
          <span>
            <small>Charged ID @50</small>
            <strong>${escapeHtml(formatReferenceValue(row.chargedId50))}</strong>
          </span>
          <span>
            <small>Charged ID @150</small>
            <strong>${escapeHtml(formatReferenceValue(row.chargedId150))}</strong>
          </span>
          <span>
            <small>FL Coefficient</small>
            <strong>${escapeHtml(formatReferenceValue(row.coefficient))}</strong>
          </span>
          ${createHoseDataSourceLink(row)}
          <button
            class="small-button reference-add-profile-button"
            type="button"
            data-add-hose-profile
            data-manufacturer-name="${escapeHtml(manufacturer.name)}"
            data-model="${escapeHtml(row.model)}"
            data-trade-size="${escapeHtml(formatReferenceValue(row.tradeSize))}"
            data-charged-id50="${escapeHtml(formatReferenceValue(row.chargedId50))}"
            data-charged-id150="${escapeHtml(formatReferenceValue(row.chargedId150))}"
            data-coefficient="${escapeHtml(formatReferenceValue(row.coefficient))}"
            data-reference-url="${escapeHtml(row.referenceUrl || "")}"
          >
            Add to My Hose Profiles
          </button>
        </div>
      `).join("");
    }

    function createHoseDataCards(manufacturer) {
      const groupedRows = groupHoseDataByModel(manufacturer.hoseData || []);
      return Object.entries(groupedRows).map(([model, rows]) => `
        <details class="hose-library-card reference-hose-data-card collapsible-settings-card">
          <summary>
            <span>
              <strong>${escapeHtml(model)}</strong>
              <span class="helper">${rows.length} ${rows.length === 1 ? "entry" : "entries"}</span>
            </span>
          </summary>
          <div class="collapsible-card-body reference-hose-data-grid">
            ${createHoseDataRows(rows, manufacturer)}
          </div>
        </details>
      `).join("");
    }

    function renderHoseManufacturer(data, id) {
      const manufacturer = getHoseManufacturers(data).find(item => item.id === id);

      if (!manufacturer) {
        renderHoseManufacturers(data);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=hose-manufacturers">
            Back to Hose References
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>About</strong>
          <p class="helper">${escapeHtml(manufacturer.about)}</p>
        </article>

        ${createManufacturerWebsiteCard(manufacturer)}

        <div class="references-group">
          <h2>Reference Hose Data</h2>
          <p class="helper">${escapeHtml(manufacturer.hoseData.length)} rows from the reference source data.</p>
        </div>

        <div class="reference-hose-data-list">
          ${createHoseDataCards(manufacturer)}
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Reverse Flow Notes</strong>
          <p class="helper">${escapeHtml(manufacturer.notes)}</p>
        </article>

        <article class="hose-library-card reference-card reference-website-card">
          <div>
            <strong>Source</strong>
            <p class="helper">${escapeHtml(manufacturer.sourceNote)}</p>
            <p class="helper">${escapeHtml(manufacturer.sourceUrl)}</p>
          </div>
          <a
            class="reset-button reference-open-button"
            href="${escapeHtml(manufacturer.sourceUrl)}"
            target="_blank"
            rel="noopener"
          >
            Open Source
          </a>
        </article>
      `;
    }

    function renderTrainingPartners(data) {
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="resources.html">
            Back to Resources
          </a>
          <h2>Training Directory</h2>
          <p class="helper">Reviewed fire service training resources and instructor listings.</p>
        </div>
      `;

      referencesList.appendChild(createTrainingDirectoryIntroCard());
      loadTrainingDirectoryListings();

      if (trainingDirectoryLiveState.status === "loading") {
        referencesList.appendChild(createTrainingDirectoryStatusCard("Loading Training Directory listings.", "Fetching the latest published listings from reverse-flow.app."));
        return;
      }

      if (trainingDirectoryLiveState.status === "error") {
        referencesList.appendChild(createTrainingDirectoryStatusCard("Training Directory listings could not be loaded right now.", "Check your connection and try again."));
        return;
      }

      if (trainingDirectoryLiveState.status === "cached") {
        referencesList.appendChild(createTrainingDirectoryStatusCard("Showing recently loaded listings.", "", "reference-cache-status-card"));
      }

      const trainingDirectoryListings = getTrainingDirectoryListings(data);

      if (!trainingDirectoryListings.length) {
        referencesList.appendChild(createTrainingDirectoryEmptyCard());
        return;
      }

      trainingDirectoryListings.forEach(partner => {
        referencesList.appendChild(createTrainingDirectoryListingCard(partner));
      });
    }

    function renderTrainingResources(data) {
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="resources.html">
            Back to Resources
          </a>
          <h2>Training Resources</h2>
        </div>
      `;

      referencesList.appendChild(createTrainingResourcesEmptyCard());
    }

    function renderTrainingDirectorySubmissionPlaceholder() {
      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=training-partners">
            Back to Training Directory
          </a>
          <h2>Submit a Training Organization</h2>
          <p class="helper">Training Directory submissions are handled on the Reverse Flow website.</p>
        </div>
      `;
      referencesList.appendChild(createTrainingDirectorySubmissionCard());
    }

    function renderManufacturer(data, id) {
      const manufacturer = [
        ...getHoseManufacturers(data),
        ...getEquipmentManufacturers(data)
      ].find(item => item.id === id);

      if (!manufacturer) {
        renderOverview(data);
        return;
      }

      if (getHoseManufacturers(data).some(item => item.id === id)) {
        renderHoseManufacturer(data, id);
        return;
      }

      if (getEquipmentManufacturers(data).some(item => item.id === id)) {
        renderEquipmentManufacturer(data, id);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=manufacturers">
            Back to Manufacturer References
          </a>
          <h2>${escapeHtml(manufacturer.name)}</h2>
          <p class="helper">Manufacturer resources and product references.</p>
        </div>
        ${createManufacturerWebsiteCard(manufacturer)}
        ${createCategoryList(manufacturer.categories)}
      `;
    }

    function renderTrainingPartner(data, id) {
      const partner = data.trainingPartners.find(item => item.id === id);

      if (!partner) {
        renderTrainingPartners(data);
        return;
      }

      referencesList.innerHTML = `
        <div class="references-group">
          <a class="reset-button reference-open-button reference-back-link" href="references.html?section=training-partners">
            Back to Training Directory
          </a>
          <div class="reference-partner-header${partner.logo ? "" : " reference-partner-header-no-logo"}">
            ${createTrainingPartnerLogo(partner)}
            <div class="reference-partner-title-copy">
              <h2>${escapeHtml(partner.name)}</h2>
              <p class="helper">${escapeHtml(partner.fullDescription || partner.description || "Training listing details coming soon.")}</p>
            </div>
          </div>
        </div>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Service Area</strong>
          <p class="helper">${escapeHtml(partner.serviceArea || "Service area coming soon.")}</p>
          <p class="helper">${escapeHtml(Array.isArray(partner.statesServed) && partner.statesServed.length ? partner.statesServed.join(", ") : "States served not listed.")}</p>
        </article>

        <article class="hose-library-card reference-card reference-category-card reference-partner-detail-card">
          <strong>Topics</strong>
          ${createTrainingPartnerSpecialties(partner)}
        </article>

        ${createTrainingPartnerContactCard(partner)}
      `;
    }

    function renderReferences() {
      const data = getReferenceData();
      const route = getRoute();

      if (route.section === "manufacturers") {
        renderManufacturers(data);
        return;
      }

      if (route.section === "hose-manufacturers") {
        renderHoseManufacturers(data);
        return;
      }

      if (route.section === "equipment-manufacturers") {
        renderEquipmentManufacturers(data);
        return;
      }

      if (route.section === "hose-manufacturer") {
        renderHoseManufacturer(data, route.id);
        return;
      }

      if (route.section === "equipment-manufacturer") {
        renderEquipmentManufacturer(data, route.id);
        return;
      }

      if (route.section === "equipment-category") {
        renderEquipmentCategory(data, route.id);
        return;
      }

      if (route.section === "equipment-product") {
        renderEquipmentProduct(data, route.id);
        return;
      }

      if (route.section === "training-partners") {
        renderTrainingPartners(data);
        return;
      }

      if (route.section === "training-partner") {
        renderTrainingPartner(data, route.id);
        return;
      }

      if (route.section === "training-directory-submit") {
        renderTrainingDirectorySubmissionPlaceholder();
        return;
      }

      if (route.section === "training-resources") {
        renderTrainingResources(data);
        return;
      }

      if (route.section === "manufacturer") {
        renderManufacturer(data, route.id);
        return;
      }

      renderOverview(data);
    }

    renderReferences();
    loadPublishedHoseReferences();
  </script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
